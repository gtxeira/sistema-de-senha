services:
  app:
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      AUTH_TRUST_HOST: ${AUTH_TRUST_HOST:-true}
    healthcheck:
      test: [
        "CMD",
        "bun", "-e",
        "fetch('http://localhost:3000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
