services:
  app:
    build:
      context: .
      target: dev
    entrypoint: ["/bin/sh", "/app/scripts/docker-entrypoint-dev.sh"]
    ports:
      - "9229:9229"
    environment:
      - NODE_OPTIONS=--inspect=0.0.0.0:9229
    volumes:
      - .:/app
      - /app/node_modules
      - /app/node_modules/.cache
      - /app/.next
      - /app/src/generated
    networks:
      - app-network
    depends_on:
      postgres:
        condition: service_healthy
      garage:
        condition: service_started

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sistema_de_senha}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - pgdata:/var/lib/postgresql
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-sistema_de_senha}"]
      interval: 5s
      timeout: 5s
      retries: 10

  garage:
    image: dxflrs/garage:v2.4.1
    restart: unless-stopped
    ports:
      - "3900:3900"
      - "3902:3902"
    environment:
      GARAGE_DEFAULT_ACCESS_KEY: ${S3_ACCESS_KEY}
      GARAGE_DEFAULT_SECRET_KEY: ${S3_SECRET_KEY}
      GARAGE_DEFAULT_BUCKET: ${S3_BUCKET:-news-images}
    command: /garage server --single-node --default-bucket
    volumes:
      - ./garage/garage.toml:/etc/garage.toml:ro
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
    networks:
      app-network:
        aliases:
          - ${S3_BUCKET:-news-images}.localhost
          - ${S3_BUCKET_TEST:-news-images-test}.localhost
          - garage
    healthcheck:
      test: [ "CMD", "/garage", "status" ]
      interval: 2s
      timeout: 5s
      retries: 5

networks:
  app-network:
    driver: bridge

volumes:
  pgdata:
  garage-meta:
  garage-data:

